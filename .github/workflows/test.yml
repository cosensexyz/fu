# .github/workflows/test.yml
name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      # Explicit and well above the slowest local measurement (the engine race
      # suite has run 327s on hardware faster than these runners), so a genuine
      # hang is reported as a timeout rather than inheriting a default that may
      # be too tight on a slow runner.
      - run: go test ./... -race -count=1 -timeout 30m
      - run: make fmt-check
